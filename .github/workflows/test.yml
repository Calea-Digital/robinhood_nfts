name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The specification lives in openspec/; the prose documents under docs/ carry generated blocks
  # between markers. Both gates run from the copies installed in docs/tools/spec_tools/, so they
  # need nothing outside this repository. The code and its gates are in mintdotio/NFT. See
  # CLAUDE.md, "Specification and board".
  spec:
    name: Specification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Generated prose is current and lint is clean
        run: |
          python3 docs/tools/spec_tools/lint_spec.py --root .
          python3 docs/tools/spec_tools/render_calea_prose.py --root . --check
