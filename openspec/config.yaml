schema: calea-house

engagement: client
spec_version: "2.3"

context: |
  Tech stack: Foundry / Solidity 0.8.17 (pinned by SeaDrop's exact pragma; evm london), OpenSea ERC721SeaDrop, Solady.
  Domain: MintABear — a 4,444-supply NFT collection on Robinhood Chain (chain id 4663) with $MNTD burn-to-level
  activation and an instant, Chainlink-VRF-decided mystery box across several prize chains. Six contracts:
  MintABear, WhitelistClaim, Activation, MysteryBox, PrizeVault, PrizeDraw.
  Client engagement: yes — MINT (getminted.io); Calea / Rayco builds. Keep in sync with `engagement:` above.
  Conventions: deterministic unit tests only (fuzz and invariant harnesses are the internal auditor's), a BTT tree
  per contract (test/<Contract>.tree.md), a /* Scenario: Given / When / Then */ block in every test, final-state prose.
  Tracker: YouTrack project MNT through the ai-stack bridge (docs/tools/board.sh); the work loop is in CLAUDE.md.

rules:
  specs:
    - "Every Scenario must have a matching leaf in test/<Contract>.tree.md and a /* Scenario: */ block above the matching unit test."
    - "A MODIFIED delta repeats the **Kind:** line; openspec archive drops it otherwise and the bridge then refuses the spec."
    - "Family prefixes in use (prefix → spec path): COL → specs/collection, WL → specs/whitelist, ACT → specs/activation, RAF → specs/mystery-box, OPS → specs/operations, DEL → specs/deliverables."
  decisions:
    - "Decision ids keep the prefix the project already uses; one namespace, one id for life."

operations:
  archive:
    guidance:
      - >
        Fold this change's decisions.md delta into openspec/decisions.md by hand (archive does not),
        and add any REMOVED requirement's id to its family's '## Retired Requirements' with its reason
        and pointer (archive deletes the block and writes nothing). Then run docs/tools/board.sh.
